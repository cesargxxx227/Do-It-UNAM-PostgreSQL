<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do It UNAM - Editor</title>
    <!-- Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fuente Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .canvas-bg {
            /* Puedes cambiar esta URL por la imagen de montañas que prefieras */
            background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
        }
        /* Estilos para el scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col bg-[#f3f4f6] overflow-hidden text-gray-700">

    <!-- BARRA SUPERIOR (Navbar) -->
    <header class="bg-white h-14 flex items-center justify-between px-4 border-b border-gray-200 shrink-0">
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 text-blue-900 font-bold text-lg">
                <i class="fa-solid fa-graduation-cap text-yellow-500"></i> DO IT UNAM
            </div>
            <div class="flex items-center gap-3 text-gray-400 ml-4">
                <button class="hover:text-gray-600"><i class="fa-solid fa-rotate-left"></i></button>
                <button class="hover:text-gray-600"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
            <div class="flex items-center ml-4 px-3 py-1.5 bg-gray-100 rounded-md">
                <i class="fa-solid fa-pen text-xs text-gray-500 mr-2"></i>
                <input type="text" value="Nombre del proyecto" class="bg-transparent border-none outline-none text-sm w-40 text-gray-600">
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button class="bg-[#0b3b60] text-white px-4 py-1.5 rounded-md text-sm font-medium flex items-center gap-2 hover:bg-blue-900">
                <i class="fa-solid fa-arrow-up-from-bracket"></i> Compartir
            </button>
            <button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-600">
                <i class="fa-solid fa-ellipsis"></i>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- BARRA LATERAL IZQUIERDA -->
        <aside class="w-20 bg-white border-r border-gray-200 flex flex-col items-center py-4 gap-6 shrink-0 z-10 shadow-sm">
            <button class="flex flex-col items-center gap-1 text-[#0b3b60] bg-blue-50 w-full py-2 border-l-4 border-[#0b3b60]">
                <i class="fa-solid fa-font text-xl"></i>
                <span class="text-[10px] font-medium">Texto</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-gray-500 hover:text-gray-800 w-full py-2">
                <i class="fa-regular fa-image text-xl"></i>
                <span class="text-[10px]">Imágenes</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-gray-500 hover:text-gray-800 w-full py-2">
                <i class="fa-solid fa-wand-magic-sparkles text-xl"></i>
                <span class="text-[10px]">IA</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-gray-500 hover:text-gray-800 w-full py-2">
                <i class="fa-solid fa-shapes text-xl"></i>
                <span class="text-[10px]">Elementos</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-gray-500 hover:text-gray-800 w-full py-2">
                <i class="fa-solid fa-music text-xl"></i>
                <span class="text-[10px]">Audio</span>
            </button>
            <button class="flex flex-col items-center gap-1 text-gray-500 hover:text-gray-800 w-full py-2">
                <i class="fa-solid fa-palette text-xl"></i>
                <span class="text-[10px]">Fondos</span>
            </button>
        </aside>

        <!-- ÁREA CENTRAL DE TRABAJO -->
        <main class="flex-1 flex flex-col relative">
            <!-- Barra de herramientas de texto (Flotante o superior) -->
            <div class="h-12 bg-white flex items-center px-4 border-b border-gray-200 gap-2 m-4 rounded-md shadow-sm w-fit">
                <select class="bg-transparent outline-none text-sm text-gray-700 cursor-pointer w-24">
                    <option>Poppins</option>
                    <option>Arial</option>
                </select>
                <div class="h-4 w-px bg-gray-300 mx-1"></div>
                <div class="flex items-center gap-2">
                    <input type="number" value="48" class="w-12 text-center text-sm border border-gray-200 rounded-md outline-none">
                </div>
                <div class="h-4 w-px bg-gray-300 mx-1"></div>
                <div class="flex gap-1">
                    <button class="w-8 h-8 rounded hover:bg-gray-100 flex items-center justify-center text-blue-600 font-bold"><i class="fa-solid fa-b"></i></button>
                    <button class="w-8 h-8 rounded hover:bg-gray-100 flex items-center justify-center italic"><i class="fa-solid fa-i"></i></button>
                    <button class="w-8 h-8 rounded hover:bg-gray-100 flex items-center justify-center underline"><i class="fa-solid fa-u"></i></button>
                </div>
                <div class="h-4 w-px bg-gray-300 mx-1"></div>
                <div class="flex gap-1">
                    <button class="w-8 h-8 rounded hover:bg-gray-100 flex items-center justify-center"><i class="fa-solid fa-align-center"></i></button>
                    <button class="w-8 h-8 rounded hover:bg-gray-100 flex items-center justify-center"><i class="fa-solid fa-list-ul"></i></button>
                    <button class="w-8 h-8 rounded hover:bg-gray-100 flex items-center justify-center"><i class="fa-solid fa-ellipsis"></i></button>
                </div>
            </div>

            <!-- LIENZO (Canvas) -->
            <div class="flex-1 flex items-center justify-center p-8 overflow-auto">
                <div class="canvas-bg w-full max-w-[800px] aspect-video bg-white shadow-md relative flex flex-col items-center justify-center text-center">
                    <!-- Cuadro de selección de texto simulado -->
                    <div class="border border-white/50 p-6 relative group cursor-pointer">
                        <div class="absolute -top-1 -left-1 w-2 h-2 bg-white rounded-full"></div>
                        <div class="absolute -top-1 -right-1 w-2 h-2 bg-white rounded-full"></div>
                        <div class="absolute -bottom-1 -left-1 w-2 h-2 bg-white rounded-full"></div>
                        <div class="absolute -bottom-1 -right-1 w-2 h-2 bg-white rounded-full"></div>

                        <h1 class="text-white text-6xl font-bold leading-tight drop-shadow-lg">
                            Explora <br> sin límites
                        </h1>
                        <p class="text-yellow-500 tracking-[0.3em] text-sm mt-4 font-semibold drop-shadow-md uppercase">
                            Ideas • Diseño • Un mundo mejor
                        </p>
                    </div>
                </div>
            </div>

            <!-- PANEL DERECHO: Animaciones (Flotante) -->
            <div class="absolute right-6 top-6 w-72 bg-white rounded-xl shadow-lg border border-gray-100 p-5 z-20">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-gray-800">Animaciones</h3>
                    <button class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <div class="flex border-b border-gray-200 mb-4 text-sm">
                    <button class="pb-2 border-b-2 border-blue-600 font-semibold text-gray-800 mr-4">Entrada</button>
                    <button class="pb-2 text-gray-500 hover:text-gray-700 mr-4">Énfasis</button>
                    <button class="pb-2 text-gray-500 hover:text-gray-700">Salida</button>
                </div>

                <div class="grid grid-cols-3 gap-2 mb-6">
                    <button class="flex flex-col items-center justify-center p-2 rounded-lg border border-gray-200 hover:bg-gray-50 text-gray-500">
                        <i class="fa-solid fa-ban mb-1"></i>
                        <span class="text-[10px]">Ninguna</span>
                    </button>
                    <button class="flex flex-col items-center justify-center p-2 rounded-lg border-2 border-blue-200 bg-blue-50 text-blue-700">
                        <i class="fa-solid fa-star mb-1"></i>
                        <span class="text-[10px] font-medium">Desvanecer</span>
                    </button>
                    <button class="flex flex-col items-center justify-center p-2 rounded-lg border border-gray-200 hover:bg-gray-50 text-gray-500">
                        <i class="fa-solid fa-arrow-right-to-bracket mb-1"></i>
                        <span class="text-[10px]">Deslizar</span>
                    </button>
                    <button class="flex flex-col items-center justify-center p-2 rounded-lg border border-gray-200 hover:bg-gray-50 text-gray-500">
                        <i class="fa-solid fa-wand-magic mb-1"></i>
                        <span class="text-[10px]">Aparecer</span>
                    </button>
                    <button class="flex flex-col items-center justify-center p-2 rounded-lg border border-gray-200 hover:bg-gray-50 text-gray-500">
                        <i class="fa-solid fa-compress mb-1"></i>
                        <span class="text-[10px]">Zoom</span>
                    </button>
                    <button class="flex flex-col items-center justify-center p-2 rounded-lg border border-gray-200 hover:bg-gray-50 text-gray-500">
                        <i class="fa-solid fa-arrow-rotate-right mb-1"></i>
                        <span class="text-[10px]">Rebotar</span>
                    </button>
                </div>

                <div class="flex items-center gap-3">
                    <span class="text-xs text-gray-500 font-medium">Duración</span>
                    <input type="range" min="0" max="5" step="0.1" value="0.8" class="flex-1 h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                    <div class="border border-gray-200 rounded px-2 py-1 text-xs w-10 text-center">
                        0.8<br><span class="text-[8px] text-gray-400">s</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- BARRA INFERIOR (Timeline / Páginas) -->
    <footer class="bg-white h-16 border-t border-gray-200 flex items-center justify-between px-4 shrink-0 z-20">
        <div class="flex gap-2">
            <button class="w-8 h-8 rounded-full bg-[#0b3b60] text-white flex items-center justify-center text-xs">1</button>
            <button class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gray-200 flex items-center justify-center text-xs text-gray-600"><i class="fa-solid fa-plus"></i></button>
        </div>

        <div class="flex items-center gap-2 overflow-x-auto">
            <!-- Miniaturas simuladas -->
            <div class="w-16 h-10 bg-gray-300 rounded overflow-hidden border-2 border-blue-500 relative cursor-pointer">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?ixlib=rb-4.0.3&auto=format&fit=crop&w=150&q=80" class="w-full h-full object-cover">
                <span class="absolute bottom-0 right-1 text-[8px] text-white font-bold drop-shadow-md">1</span>
            </div>
            <div class="w-16 h-10 bg-gray-300 rounded overflow-hidden opacity-70 hover:opacity-100 cursor-pointer relative">
                <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?ixlib=rb-4.0.3&auto=format&fit=crop&w=150&q=80" class="w-full h-full object-cover">
                <span class="absolute bottom-0 right-1 text-[8px] text-white font-bold drop-shadow-md">2</span>
            </div>
            <div class="w-16 h-10 bg-gray-300 rounded overflow-hidden opacity-70 hover:opacity-100 cursor-pointer relative">
                <img src="https://images.unsplash.com/photo-1506744626753-eda8151a1571?ixlib=rb-4.0.3&auto=format&fit=crop&w=150&q=80" class="w-full h-full object-cover">
                <span class="absolute bottom-0 right-1 text-[8px] text-white font-bold drop-shadow-md">3</span>
            </div>
            <button class="w-10 h-10 border border-dashed border-gray-400 rounded flex items-center justify-center text-gray-500 hover:bg-gray-50">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <div class="flex items-center gap-4 text-gray-500">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-minus text-xs cursor-pointer hover:text-gray-800"></i>
                <input type="range" class="w-24 h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                <i class="fa-solid fa-plus text-xs cursor-pointer hover:text-gray-800"></i>
                <span class="text-xs font-medium w-8 text-center">75%</span>
            </div>
            <button class="hover:text-gray-800"><i class="fa-solid fa-expand"></i></button>
            <button class="hover:text-gray-800"><i class="fa-solid fa-table-cells-large"></i></button>
        </div>
    </footer>

</body>
</html>
